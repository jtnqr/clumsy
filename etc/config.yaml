# ============================================================================
# CLUMSY GLOBAL CONFIGURATION
# ============================================================================
# This file defines the core operational profiles (presets) for packet manipulation.
#
# Profile Schema:
#   - name: "Profile Name"      # Display name of the preset
#     filter: "WinDivert filter" # e.g. "inbound", "outbound and tcp", "udp"
#     process_filter:            # (Optional) Target specific processes
#       enabled: true/false
#       target: "process_name"   # e.g., "roblox", "notepad"
#       duration:                # (Optional) Duration controls
#         enabled: true/false
#         value_ms: 10
#     modules:                   # (Optional) Interception modules
#                                # Only active/enabled modules need to be specified.
#
# Module Reference & Examples:
#
#   1. lag: Delay packets by a specified time.
#      lag:
#        enabled: true
#        inbound: true           # Intercept inbound packets
#        outbound: true          # Intercept outbound packets
#        time: 100               # Delay time in milliseconds (integer)
#
#   2. drop: Drop packets randomly.
#      drop:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 10.0            # Drop probability in % (float, 0.0 - 100.0)
#
#   3. throttle: Block traffic for a timeframe then send it.
#      throttle:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 20.0            # Throttle probability in %
#        frame: 30               # Block duration window in ms
#        drop: false             # Whether to drop throttled packets instead of sending
#
#   4. duplicate: Send copy of packets.
#      duplicate:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 15.0            # Duplication probability in %
#        count: 2                # Number of duplicate packets to send (integer)
#
#   5. ood: Out of order (ood) packets delivery.
#      ood:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 10.0            # Probability of out-of-order delivery in %
#
#   6. tamper: Tamper packet checksum or payloads.
#      tamper:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 5.0             # Tampering probability in %
#        checksum: true          # Recalculate checksum or break it (bool)
#
#   7. reset: Send TCP reset / ICMP unreachable packets.
#      reset:
#        enabled: true
#        inbound: true
#        outbound: true
#        chance: 10.0            # Probability in %
#
#   8. bandwidth: Limit bandwidth rate.
#      bandwidth:
#        enabled: true
#        inbound: true
#        outbound: true
#        limit: 10               # Bandwidth limit (e.g. KB/s)
# ============================================================================

hotkey: "f6"

profiles:
  - name: "roblox inbound"
    filter: "inbound"
    process_filter:
      enabled: true
      target: "roblox"
      duration:
        enabled: false
        value_ms: 10
      modules:
        drop:
          enabled: true
          inbound: true
          outbound: false
          chance: 100.0
        bandwidth:
          enabled: true
          inbound: true
          outbound: false
          limit: 1

  - name: "localhost ipv4 all"
    filter: "outbound and loopback"

  - name: "localhost ipv4 tcp"
    filter: "tcp and outbound and loopback"

  - name: "localhost ipv4 udp"
    filter: "udp and outbound and loopback"

  - name: "all sending packets"
    filter: "outbound"

  - name: "all receiving packets"
    filter: "inbound"

  - name: "all ipv4 against specific ip"
    filter: "ip.DstAddr == 198.51.100.1 or ip.SrcAddr == 198.51.100.1"

  - name: "tcp ipv4 against specific ip"
    filter: "tcp and (ip.DstAddr == 198.51.100.1 or ip.SrcAddr == 198.51.100.1)"

  - name: "udp ipv4 against specific ip"
    filter: "udp and (ip.DstAddr == 198.51.100.1 or ip.SrcAddr == 198.51.100.1)"

  - name: "all ipv4 against port"
    filter: "tcp.DstPort == 12354 or tcp.SrcPort == 12354 or udp.DstPort == 12354 or udp.SrcPort == 12354"

  - name: "tcp ipv4 against port"
    filter: "tcp and (tcp.DstPort == 12354 or tcp.SrcPort == 12354)"

  - name: "udp ipv4 against port"
    filter: "udp and (udp.DstPort == 12354 or udp.SrcPort == 12354)"

  - name: "ipv6 all"
    filter: "ipv6"
